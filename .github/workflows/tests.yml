name: Tests

# This repo takes merges from several people plus two bot authors
# (google-labs-jules, copilot-swe-agent). Running the suite on every PR is the
# only thing standing between an unreviewed bot commit and production.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        # No secrets and no services: the suite pins DATABASE_URL to in-memory
        # SQLite in tests/conftest.py and refuses to start if anything else
        # resolves, so CI can never reach the real Supabase database.
        run: pytest

  migrations:
    name: Alembic has a single head
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for a forked migration graph
        # A branch carrying a migration whose down_revision points at an old
        # revision produces two heads, and `alembic upgrade head` then fails
        # outright against production. That has already happened once on this
        # repo and is still sitting unmerged on origin/dev-main, so catch it at
        # PR time instead of at deploy time.
        env:
          DATABASE_URL: sqlite://
          JWT_SECRET: ci-not-a-real-secret
          SUPABASE_URL: https://ci.example.com
          SUPABASE_SERVICE_KEY: ci-not-a-real-key
        run: |
          heads=$(alembic heads | grep -c '(head)' || true)
          echo "alembic heads:"
          alembic heads
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly 1 Alembic head, found $heads. Rebase the migration onto the current head instead of branching the graph."
            exit 1
          fi

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check and build
        # `tsc -b` covers the test files too, so a broken mock signature fails
        # here rather than at the next deploy.
        run: npm run build

